server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: curso-api

  config:
    import: optional:file:.env[.properties]

  # Database configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

# Logging
logging:
  level:
    com.learnig_spring_boot: ${APP_LOGIN_LEVEL:INFO}
